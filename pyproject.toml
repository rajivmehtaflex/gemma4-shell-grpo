[project]
name = "shell-grpo"
version = "0.1.0"
description = "Executable-verified Bash task grading for direct GRPO research (Phase 1 CPU grader)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shell_grpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: executes candidate scripts inside the restricted Linux grading image (Codespace only, never the macOS dev host)",
]
